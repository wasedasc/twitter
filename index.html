<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tweet Card</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script async src="https://platform.twitter.com/widgets.js"></script>
<style>
body{
  background:#f6f7f9;
  font-family:"Inter","Noto Sans JP",system-ui,sans-serif;
  padding:40px
}
input,button{
  padding:10px 14px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #d0d7de
}
button{
  background:#3ea8ff;
  color:white;
  border:none
}
#card{
  max-width:620px;
  background:white;
  border-radius:18px;
  padding:28px;
  margin-top:24px;
  box-shadow:0 12px 28px rgba(0,0,0,0.06)
}
.twitter-tweet{
  margin:0
}
.twitter-tweet iframe{
  width:100% !important
}
.footer{
  display:flex;
  gap:28px;
  margin-top:20px;
  color:#9aa0a6;
  font-size:18px
}
</style>
</head>
<body>

<input id="url" placeholder="https://x.com/...">
<button onclick="loadTweet()">生成</button>
<button onclick="saveImage()">PNG保存</button>

<div id="card"></div>

<script>
async function loadTweet(){
  const url=document.getElementById("url").value
  const api="https://publish.twitter.com/oembed?omit_script=1&dnt=1&url="+encodeURIComponent(url)
  const res=await fetch(api)
  const data=await res.json()
  const card=document.getElementById("card")
  card.innerHTML=data.html+`<div class="footer">💬 🔁 ❤️</div>`
  if(window.twttr){
    window.twttr.widgets.load(card)
  }
}
function saveImage(){
  html2canvas(document.getElementById("card"),{scale:2,backgroundColor:"#ffffff"}).then(c=>{
    const a=document.createElement("a")
    a.href=c.toDataURL("image/png")
    a.download="tweet.png"
    a.click()
  })
}
</script>

</body>
</html>
