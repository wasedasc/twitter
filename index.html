<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tweet Text Card</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
body{
  background:#f6f7f9;
  font-family:"Inter","Noto Sans JP",system-ui,sans-serif;
  padding:40px
}
.controls{
  display:flex;
  gap:8px
}
input,button{
  padding:10px 14px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #d0d7de
}
button{
  background:#3ea8ff;
  color:white;
  border:none;
  cursor:pointer
}
#card{
  max-width:640px;
  background:white;
  border-radius:20px;
  padding:28px;
  margin-top:24px;
  box-shadow:0 12px 28px rgba(0,0,0,0.06)
}
.header{
  font-weight:600;
  font-size:16px
}
.date{
  margin-top:4px;
  font-size:14px;
  color:#6b7280
}
.content{
  margin-top:18px;
  font-size:18px;
  line-height:1.8
}
.footer{
  display:flex;
  gap:28px;
  margin-top:22px;
  color:#9aa0a6;
  font-size:18px
}
#hidden{
  display:none
}
</style>
</head>
<body>

<div class="controls">
  <input id="url" placeholder="https://x.com/..." onkeydown="if(event.key==='Enter')loadTweet()">
  <button onclick="pasteUrl()">貼り付け</button>
  <button onclick="loadTweet()">生成</button>
  <button onclick="saveImage()">PNG保存</button>
</div>

<div id="hidden"></div>
<div id="card"></div>

<script>
async function pasteUrl(){
  const text=await navigator.clipboard.readText()
  document.getElementById("url").value=text
}

async function loadTweet(){
  const url=document.getElementById("url").value
  if(!url)return

  const api="https://publish.twitter.com/oembed?omit_script=1&dnt=1&url="+encodeURIComponent(url)
  const res=await fetch(api)
  const data=await res.json()

  const hidden=document.getElementById("hidden")
  hidden.innerHTML=data.html

  const block=hidden.querySelector("blockquote")
  if(!block)return

  const p=block.querySelector("p")
  if(!p)return

  p.querySelectorAll("a").forEach(a=>{
    if(a.innerText.startsWith("pic.twitter.com"))a.remove()
  })

  const timeEl=block.querySelector("time")
  const date=timeEl?timeEl.getAttribute("datetime").slice(0,10):""

  const links=[...block.querySelectorAll("a")]
  const userLink=links.find(a=>a.innerText.startsWith("@"))
  const username=userLink?userLink.innerText:"@unknown"

  const card=document.getElementById("card")
  card.innerHTML=`
    <div class="header">${username}</div>
    <div class="date">${date}</div>
    <div class="content">${p.innerHTML}</div>
    <div class="footer">💬 🔁 ❤️</div>
  `
}

function saveImage(){
  html2canvas(document.getElementById("card"),{scale:2,backgroundColor:"#ffffff"}).then(c=>{
    const a=document.createElement("a")
    a.href=c.toDataURL("image/png")
    a.download="tweet.png"
    a.click()
  })
}
</script>

</body>
</html>
