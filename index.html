<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tweet to Card</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
body{
  background:#f6f7f9;
  font-family:"Inter","Noto Sans JP",system-ui,sans-serif;
  padding:40px
}
.controls{
  display:flex;
  gap:8px
}
input,button{
  padding:10px 14px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #d0d7de
}
button{
  background:#3ea8ff;
  color:white;
  border:none;
  cursor:pointer
}
#card{
  max-width:640px;
  background:white;
  border-radius:20px;
  padding:28px;
  margin-top:24px;
  box-shadow:0 12px 28px rgba(0,0,0,0.06)
}
.header{
  display:flex;
  align-items:center;
  gap:14px
}
.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#dbeafe;
  color:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:600
}
.name{
  font-weight:600
}
.meta{
  font-size:14px;
  color:#6b7280
}
.date{
  margin-left:auto;
  font-size:13px;
  color:#9aa0a6
}
.content{
  margin-top:18px;
  font-size:18px;
  line-height:1.8
}
.content img{
  width:100%;
  border-radius:16px;
  margin-top:16px
}
.footer{
  display:flex;
  gap:28px;
  margin-top:22px;
  color:#9aa0a6;
  font-size:18px
}
#hidden{
  display:none
}
</style>
</head>
<body>

<div class="controls">
  <input id="url" placeholder="https://x.com/..." onkeydown="if(event.key==='Enter')loadTweet()">
  <button onclick="pasteUrl()">貼り付け</button>
  <button onclick="loadTweet()">生成</button>
  <button onclick="saveImage()">PNG保存</button>
</div>

<div id="hidden"></div>
<div id="card"></div>

<script>
async function pasteUrl(){
  const text=await navigator.clipboard.readText()
  document.getElementById("url").value=text
}
async function loadTweet(){
  const url=document.getElementById("url").value
  if(!url)return
  const api="https://publish.twitter.com/oembed?omit_script=1&dnt=1&url="+encodeURIComponent(url)
  const res=await fetch(api)
  const data=await res.json()
  const hidden=document.getElementById("hidden")
  hidden.innerHTML=data.html
  const block=hidden.querySelector("blockquote")
  const p=block.querySelector("p")
  const links=[...block.querySelectorAll("a")]
  const timeLink=links.find(a=>a.querySelector("time"))
  const date=timeLink?timeLink.innerText:""
  const userLink=links[links.length-1]
  const id=userLink?userLink.innerText:""
  const name=id.replace("@","")
  const images=[...hidden.querySelectorAll("img")]
  const card=document.getElementById("card")
  card.innerHTML=""
  const header=document.createElement("div")
  header.className="header"
  header.innerHTML=`
    <div class="avatar">${name.slice(0,1).toUpperCase()}</div>
    <div>
      <div class="name">${name}</div>
      <div class="meta">${id}</div>
    </div>
    <div class="date">${date}</div>
  `
  card.appendChild(header)
  const content=document.createElement("div")
  content.className="content"
  content.innerHTML=p.innerHTML
  images.forEach(img=>content.appendChild(img.cloneNode()))
  card.appendChild(content)
  const footer=document.createElement("div")
  footer.className="footer"
  footer.innerHTML="💬 🔁 ❤️"
  card.appendChild(footer)
}
function saveImage(){
  html2canvas(document.getElementById("card"),{scale:2,backgroundColor:"#ffffff"}).then(c=>{
    const a=document.createElement("a")
    a.href=c.toDataURL("image/png")
    a.download="tweet.png"
    a.click()
  })
}
</script>

</body>
</html>
