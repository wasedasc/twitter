<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tweet Card Generator</title>
<style>
body {
  background:#f7f8fa;
  font-family:system-ui,sans-serif;
  padding:24px;
}
.controls {
  display:flex;
  gap:8px;
  margin-bottom:16px;
}
input {
  flex:1;
  padding:10px 12px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #ddd;
}
button {
  padding:10px 14px;
  border-radius:8px;
  border:none;
  background:#3b82f6;
  color:white;
  font-size:14px;
  cursor:pointer;
}
.card {
  max-width:600px;
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}
.header {
  font-weight:600;
  font-size:15px;
}
.date {
  color:#6b7280;
  font-size:13px;
  margin-top:2px;
}
.content {
  margin-top:14px;
  font-size:15px;
  line-height:1.7;
}
.content a {
  color:#5b8def;
  text-decoration:none;
}
</style>
</head>
<body>

<div class="controls">
  <input id="url" placeholder="https://twitter.com/...">
  <button id="paste">Paste</button>
  <button id="gen">生成</button>
</div>

<div id="out"></div>

<script>
const input = document.getElementById("url")
const out = document.getElementById("out")

document.getElementById("paste").onclick = async () => {
  input.value = await navigator.clipboard.readText()
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter") generate()
})

document.getElementById("gen").onclick = generate

async function generate() {
  const url = input.value.trim()
  if (!url) return

  const api = "https://publish.twitter.com/oembed?omit_script=1&url=" + encodeURIComponent(url)
  const res = await fetch(api)
  const json = await res.json()
  const html = json.html

  const username = extractUsername(url)
  const date = extractDate(html)
  const content = extractContent(html)

  out.innerHTML = `
    <div class="card">
      <div class="header">@${username}</div>
      <div class="date">${date}</div>
      <div class="content">${content}</div>
    </div>
  `
}

function extractUsername(url) {
  const m = url.match(/twitter\.com\/([^\/]+)/)
  return m ? m[1] : "unknown"
}

function extractDate(html) {
  const m = html.match(/datetime="([^"]+)"/)
  if (!m) return ""
  const d = new Date(m[1])
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`
}

function extractContent(html) {
  const m = html.match(/<p[^>]*>([\s\S]*?)<\/p>/)
  if (!m) return ""
  return m[1]
}
</script>

</body>
</html>
