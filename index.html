<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Tweet Card</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
body{
  background:#f6f7f9;
  font-family:"Inter","Noto Sans JP",system-ui,sans-serif;
  padding:40px
}
input,button{
  padding:10px 14px;
  font-size:16px;
  border-radius:8px;
  border:1px solid #d0d7de
}
button{
  background:#3ea8ff;
  color:white;
  border:none;
  cursor:pointer
}
#card{
  max-width:620px;
  background:white;
  border-radius:18px;
  padding:28px;
  margin-top:24px;
  box-shadow:0 12px 28px rgba(0,0,0,0.06)
}
.header{
  display:flex;
  align-items:center;
  gap:12px
}
.header img{
  width:48px;
  height:48px;
  border-radius:50%
}
.name{
  font-weight:600
}
.meta{
  font-size:14px;
  color:#6b7280
}
.date{
  margin-left:auto;
  font-size:13px;
  color:#9aa0a6
}
.content{
  margin-top:16px;
  font-size:18px;
  line-height:1.8
}
.content img{
  margin-top:16px;
  width:100%;
  border-radius:14px
}
.footer{
  display:flex;
  gap:28px;
  margin-top:20px;
  color:#9aa0a6;
  font-size:18px
}
.footer span{
  display:flex;
  align-items:center;
  gap:6px
}
</style>
</head>
<body>

<input id="url" placeholder="https://x.com/...">
<button onclick="loadTweet()">生成</button>
<button onclick="saveImage()">PNG保存</button>

<div id="card"></div>

<script>
async function loadTweet(){
  const url=document.getElementById("url").value
  const api="https://publish.twitter.com/oembed?omit_script=1&dnt=1&url="+encodeURIComponent(url)
  const res=await fetch(api)
  const data=await res.json()
  const wrapper=document.createElement("div")
  wrapper.innerHTML=data.html
  const tweet=wrapper.querySelector(".twitter-tweet")
  const avatar=tweet.querySelector("img")
  const name=tweet.querySelector("strong")
  const id=tweet.querySelector("a")
  const time=tweet.querySelector("time")
  const text=tweet.querySelector("p")
  const images=tweet.querySelectorAll("img:not(:first-child)")
  const card=document.getElementById("card")
  card.innerHTML=""
  const header=document.createElement("div")
  header.className="header"
  header.innerHTML=`
    <img src="${avatar.src}">
    <div>
      <div class="name">${name.innerText}</div>
      <div class="meta">${id.innerText}</div>
    </div>
    <div class="date">${time.innerText}</div>
  `
  card.appendChild(header)
  const content=document.createElement("div")
  content.className="content"
  content.innerHTML=text.innerHTML
  images.forEach(img=>content.appendChild(img.cloneNode()))
  card.appendChild(content)
  const footer=document.createElement("div")
  footer.className="footer"
  footer.innerHTML=`
    <span>💬</span>
    <span>🔁</span>
    <span>❤️</span>
  `
  card.appendChild(footer)
}
function saveImage(){
  html2canvas(document.getElementById("card"),{scale:2}).then(c=>{
    const a=document.createElement("a")
    a.href=c.toDataURL("image/png")
    a.download="tweet.png"
    a.click()
  })
}
</script>

</body>
</html>
